<div class="cbp_tmicon bg-green">
  <i class="zmdi zmdi-account-o"></i>
</div>
<div class="cbp_tmlabel">
  <section class="body">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12 col-md-12 col-sm-12 align-center">
          <div class="form-group form-float">
            <div class="container">
              <div class="container">
                <div class="row well">
                  <div
                    class="col-sm-5 col-md-4 col-lg-3 col-xl-2"
                    *ngFor="let t of teethTab"
                  >
                    <div class="demo-google-material-icon align-center">
                      <img
                        fill
                        loading="lazy"
                        [src]="t.icone"
                        class="material-icons"
                        [style]="'background-color: ' + t.color"
                      />
                      <span class="icon-name">{{ t.id }} </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="col-lg-12 col-md-12" *ngIf="this.treatment?.teethComment">
    <div class="progress-container">
      <span class="progress-badge">{{ this.treatment?.teethComment }}</span>
      <div class="progress">
        <div
          class="progress-bar"
          role="progressbar"
          aria-valuenow="100"
          aria-valuemin="0"
          aria-valuemax="100"
          style="width: 100%"
        ></div>
      </div>
    </div>
  </div>
</div>
