<div class="cbp_tmicon bg-orange">
  <i class="zmdi zmdi-account-o"></i>
</div>
<div class="cbp_tmlabel">
  <h2>
    <span>
      {{
        "components.timeline-new-treatment.patient-treat-photos-informations.header-title"
          | translate
      }}
    </span>
    <a href="javascript:void(0);">
      {{
        "components.timeline-new-treatment.patient-treat-photos-informations.header-title-photos"
          | translate
      }}</a
    >
  </h2>

  <div class="row justify-content-center align-center">
    <div
      class="col-lg-3 col-md-6 col-6 align-center"
      *ngFor="let item of photos"
    >
      <ng-container *ngIf="existedFile(item) != undefined; else elseTemplate">
        <a href="javascript:void(0);" *ngIf="existedFile(item) != undefined"
          ><img
            fill
            loading="lazy"
            [src]="existedFile(item).imageUrl"
            alt=""
            class="img-fluid img-thumbnail m-t-30"
          />
          <p class="m-b-5 text-muted">
            <small>{{ item.label }}</small>
          </p>
        </a>
      </ng-container>
      <ng-template #elseTemplate>
        <div class="post-img">
          <img
            fill
            loading="lazy"
            src="assets/images/image-grise.png"
            class="img-fluid img-thumbnail m-t-30"
            alt=""
          />
          <small>{{ item.label }}</small>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="col-lg-12 col-md-12" *ngIf="this.treatment?.photosComment">
    <div class="progress-container">
      <span class="progress-badge">{{ this.treatment?.photosComment }}</span>
      <div class="progress">
        <div
          class="progress-bar"
          role="progressbar"
          aria-valuenow="100"
          aria-valuemin="0"
          aria-valuemax="100"
          style="width: 100%"
        ></div>
      </div>
    </div>
  </div>
</div>
