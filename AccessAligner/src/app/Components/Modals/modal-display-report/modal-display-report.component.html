<div class="modal-content">
  <div class="modal-body">
    <ngx-extended-pdf-viewer
      [src]="'assets/examplepdf.pdf'"
    ></ngx-extended-pdf-viewer>
  </div>

  <div class="modal-footer">
    <div class="float-right">
      <button
        type="reset"
        class="btn btn-primary btn-simple btn-round"
      >
        Close
      </button>
    </div>
  </div>
</div>
