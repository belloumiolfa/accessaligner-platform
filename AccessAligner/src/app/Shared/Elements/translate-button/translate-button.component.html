<div class="header">
  <ul class="header-dropdown">
    <div [class]="show === true ? 'dropdown show' : 'dropdown'">
      <a
        class="dropdown-toggle"
        href="javascript:void(0);"
        role="button"
        (click)="show = !show"
        [style]="'color:' + color + '; margin-right:20px'"
      >
        <i class="zmdi zmdi-globe-alt"></i>
      </a>

      <div
        [class]="
          show === true ? 'dropdown-menu slideUp' : 'dropdown-menu slideDown'
        "
      >
        <a class="dropdown-item" (click)="changeLanguage('fr')">
          {{ "shared.french-label" | translate }}
        </a>

        <div class="dropdown-divider"></div>
        <a class="dropdown-item" (click)="changeLanguage('eg')">
          {{ "shared.english-label" | translate }}
        </a>
      </div>
    </div>
  </ul>
</div>
