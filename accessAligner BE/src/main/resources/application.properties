spring.profiles.active=dev
# spring.application.name=back-end

# Select dev or prod explicitly with SPRING_PROFILES_ACTIVE; no dev profile is activated by default.

# Existing databases without Flyway history are adopted at the initial schema version.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Migrations own schema changes; Hibernate only checks the mapped schema.
spring.jpa.hibernate.ddl-auto=validate

# A privileged account is never created unless a profile explicitly opts in.
app.bootstrap.super-admin.enabled=false

# Shared, non-secret application settings.
spring.messages.encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.main.lazy-initialization=true
spring.servlet.multipart.max-file-size=100000000
spring.servlet.multipart.max-request-size=100000000
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/plain,text/xml,text/css,text/javascript,application/javascript,application/json
server.compression.level=6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# These secrets must be supplied by the deployment environment.
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=2592000000
application.security.jwt.refresh-token.expiration=15552000000

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
