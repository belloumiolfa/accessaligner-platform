server.port=8081

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.web=DEBUG
springfox.documentation.swagger-ui.enabled=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.bootstrap.super-admin.enabled=${BOOTSTRAP_SUPER_ADMIN:true}
app.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME}
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD}
