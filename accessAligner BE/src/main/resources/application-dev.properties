# Port where your Spring Boot backend will run # Example: http://localhost:8081
server.port=8081

# Where Thymeleaf looks for HTML templates # "classpath:/templates/" means: src/main/resources/templates/
spring.thymeleaf.prefix=classpath:/templates/

# Thymeleaf expects the templates to end with .html
spring.thymeleaf.suffix=.html

# Use UTF-8 for messages
spring.messages.encoding=UTF-8

# Use UTF-8 for HTTP requests
spring.http.encoding.charset=UTF-8

# Enable HTTP encoding configuration
spring.http.encoding.enabled=true

# Force UTF-8 encoding
spring.http.encoding.force=true

# Tell Tomcat to use UTF-8 for URLs
server.tomcat.uri-encoding=UTF-8

# Delay creation of Spring beans until they are actually needed # This can make application startup faster
spring.main.lazy-initialization=true

# Maximum size of ONE uploaded file # 100000000 bytes ? 100 MB
spring.servlet.multipart.max-file-size=100000000

# Maximum size of the ENTIRE multipart request # Also ? 100 MB
spring.servlet.multipart.max-request-size=100000000

# Prevent Jackson from failing when it encounters certain empty beans
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Enable Gzip compression # The server compresses responses before sending them to the browser
server.compression.enabled=true

# Minimum response size before compression # Currently DISABLED because the line starts with
# 2048 bytes = 2 KB
#server.compression.min-response-size=2048

# Types of responses that can be compressed
server.compression.mime-types=text/html,text/plain,text/xml,text/css,text/javascript,application/javascript,application/json

# Compression level from 1 to 9# 6 = medium/high compression
server.compression.level=6

############################################################################################################

# The address of your MySQL database
# localhost = MySQL is running on your computer
# 3306 = MySQL's default port
# accessaligner_db = the database name
# createDatabaseIfNotExist=true = create the database automatically if it doesn't exist
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_NAME}?createDatabaseIfNotExist=true

# The MySQL user that Spring Boot will use to connect
spring.datasource.username=${MYSQL_USER}

# The password of that MySQL user
spring.datasource.password=${MYSQL_PASSWORD}

# Tells Spring Boot which JDBC driver to use for MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate automatically updates the database structure
# Example: if you add a new entity field, Hibernate can create the corresponding column
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate which SQL/database dialect to use
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Another way of specifying the database platform
# This is redundant because you already specified the dialect above
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shows detailed Spring Web logs
# Useful for debugging, but DEBUG logging should generally NOT be enabled in production
logging.level.org.springframework.web=DEBUG
############################################################################################################


#JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET}
#30 day
application.security.jwt.expiration=2592000000
#180 day
application.security.jwt.refresh-token.expiration=15552000000 

